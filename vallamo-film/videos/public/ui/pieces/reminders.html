<!doctype html>
<html lang="en-GB" data-theme="light" data-display="playfair" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="app.css">
<style>*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}
html,body{margin:0!important;padding:0!important;background:transparent!important;overflow:hidden!important;min-height:0!important;height:auto!important}
#piece{color:rgb(44, 37, 32);font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;font-size:14px;font-weight:400;line-height:20px;letter-spacing:normal;-webkit-font-smoothing:antialiased;width:610px;padding:24px;box-sizing:content-box}</style>
<style id="film-dyn"></style>
</head>
<body><div id="piece"><section><h3 class="mb-1 text-md font-semibold text-ink">Appointment reminders</h3><div class="flex flex-wrap items-start justify-between gap-x-6 gap-y-2 py-3.5"><div class="min-w-0 flex-1"><div class="text-base font-medium text-ink">Send automated reminders</div><div class="mt-0.5 text-sm text-ink-3 text-pretty">Cuts no-shows by up to about half.</div></div><div class="shrink-0 pt-0.5"><button type="button" role="switch" aria-checked="true" class="relative inline-flex shrink-0 items-center rounded-full p-[2px] transition-colors duration-200 disabled:opacity-50 h-[22px] w-[38px] bg-sage-ink"><span class="rounded-full bg-white shadow-sm transition-transform duration-200 h-[18px] w-[18px] translate-x-[16px]"></span></button></div></div><div class="space-y-1 border-l-2 border-line-soft pl-4"><div class="flex flex-wrap items-start justify-between gap-x-6 gap-y-2 py-3.5"><div class="min-w-0 flex-1"><div class="text-base font-medium text-ink">24 hours before</div><div class="mt-0.5 text-sm text-ink-3 text-pretty">Two-way: they can reply Y to confirm, C to cancel, R to rearrange.</div></div><div class="shrink-0 pt-0.5"><span class="flex items-center gap-3"><button class="text-sm font-medium text-clay-ink hover:underline">Wording</button><button type="button" role="switch" aria-checked="true" class="relative inline-flex shrink-0 items-center rounded-full p-[2px] transition-colors duration-200 disabled:opacity-50 h-[18px] w-[30px] bg-sage-ink"><span class="rounded-full bg-white shadow-sm transition-transform duration-200 h-[14px] w-[14px] translate-x-[12px]"></span></button></span></div></div><div class="flex flex-wrap items-start justify-between gap-x-6 gap-y-2 py-3.5"><div class="min-w-0 flex-1"><div class="text-base font-medium text-ink">2 hours before</div></div><div class="shrink-0 pt-0.5"><span class="flex items-center gap-3"><button class="text-sm font-medium text-clay-ink hover:underline">Wording</button><button type="button" role="switch" aria-checked="true" class="relative inline-flex shrink-0 items-center rounded-full p-[2px] transition-colors duration-200 disabled:opacity-50 h-[18px] w-[30px] bg-sage-ink"><span class="rounded-full bg-white shadow-sm transition-transform duration-200 h-[14px] w-[14px] translate-x-[12px]"></span></button></span></div></div><div class="flex flex-wrap items-start justify-between gap-x-6 gap-y-2 py-3.5"><div class="min-w-0 flex-1"><div class="text-base font-medium text-ink">Include a reschedule or cancel link</div><div class="mt-0.5 text-sm text-ink-3 text-pretty">Lets customers sort it themselves instead of not turning up.</div></div><div class="shrink-0 pt-0.5"><button type="button" role="switch" aria-checked="true" class="relative inline-flex shrink-0 items-center rounded-full p-[2px] transition-colors duration-200 disabled:opacity-50 h-[18px] w-[30px] bg-sage-ink"><span class="rounded-full bg-white shadow-sm transition-transform duration-200 h-[14px] w-[14px] translate-x-[12px]"></span></button></div></div><label class="block pt-2"><span class="label">Send by</span><select class="field"><option value="auto" selected="">Automatic: WhatsApp if they use it, then SMS, then email</option><option value="sms">SMS only</option><option value="email">Email only</option></select></label></div></section></div></body>
</html>
