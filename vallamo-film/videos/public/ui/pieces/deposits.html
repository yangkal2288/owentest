<!doctype html>
<html lang="en-GB" data-theme="light" data-display="playfair" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="app.css">
<style>*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}
html,body{margin:0!important;padding:0!important;background:transparent!important;overflow:hidden!important;min-height:0!important;height:auto!important}
#piece{color:rgb(44, 37, 32);font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;font-size:14px;font-weight:400;line-height:20px;letter-spacing:normal;-webkit-font-smoothing:antialiased;width:610px;padding:24px;box-sizing:content-box}</style>
<style id="film-dyn"></style>
</head>
<body><div id="piece"><section><div class="flex items-start justify-between gap-4"><div><h3 class="text-md font-semibold text-ink">Deposits</h3><p class="text-sm text-ink-3">Optional. Take a deposit on higher-value treatments to protect against no-shows.</p></div><button type="button" role="switch" aria-checked="true" aria-label="Take deposits" class="relative inline-flex shrink-0 items-center rounded-full p-[2px] transition-colors duration-200 disabled:opacity-50 h-[22px] w-[38px] bg-sage-ink"><span class="rounded-full bg-white shadow-sm transition-transform duration-200 h-[18px] w-[18px] translate-x-[16px]"></span></button></div><div class="mt-4 space-y-4"><div class="grid gap-4 sm:grid-cols-3"><label class="block"><span class="label">Currency</span><select class="field"><option value="GBP" selected="">GBP (£)</option><option value="EUR">EUR (€)</option><option value="USD">USD ($)</option><option value="CHF">CHF</option></select></label><label class="block"><span class="label">Type</span><select class="field"><option value="fixed" selected="">Fixed amount</option><option value="pct">Percentage (%)</option></select></label><label class="block"><span class="label">Amount</span><input class="field" type="number" value="25"><span class="hint block">Applies to every booking that takes a deposit.</span></label></div><div class="flex flex-wrap items-start justify-between gap-x-6 gap-y-2 py-3.5"><div class="min-w-0 flex-1"><div class="text-base font-medium text-ink">Hold the slot until the deposit is paid</div><div class="mt-0.5 text-sm text-ink-3 text-pretty">The strongest way to cut no-shows. When off, the booking stands and the deposit is requested in advance.</div></div><div class="shrink-0 pt-0.5"><button type="button" role="switch" aria-checked="true" class="relative inline-flex shrink-0 items-center rounded-full p-[2px] transition-colors duration-200 disabled:opacity-50 h-[18px] w-[30px] bg-sage-ink"><span class="rounded-full bg-white shadow-sm transition-transform duration-200 h-[14px] w-[14px] translate-x-[12px]"></span></button></div></div><div class="grid gap-4 sm:grid-cols-2"><label class="block"><span class="label">Nudge if unpaid after (hours)</span><input class="field" type="number" value="12"><span class="hint block">0 = never nudge.</span></label><label class="block"><span class="label">Release slot if unpaid after (hours)</span><input class="field" type="number" value="24"><span class="hint block">0 = never auto-cancel.</span></label></div><div class="flex flex-wrap items-start justify-between gap-x-6 gap-y-2 py-3.5"><div class="min-w-0 flex-1"><div class="text-base font-medium text-ink">Refund the deposit automatically if cancelled</div></div><div class="shrink-0 pt-0.5"><button type="button" role="switch" aria-checked="true" class="relative inline-flex shrink-0 items-center rounded-full p-[2px] transition-colors duration-200 disabled:opacity-50 h-[18px] w-[30px] bg-sage-ink"><span class="rounded-full bg-white shadow-sm transition-transform duration-200 h-[14px] w-[14px] translate-x-[12px]"></span></button></div></div><label class="block"><span class="label">Notice needed for a refund (hours)</span><input class="field" type="number" value="48"><span class="hint block">0 = always refund. 48 keeps the deposit as a late-cancellation fee.</span></label><label class="block"><span class="label">Cancellation policy (shown to customers)</span><input class="field" placeholder="e.g. Cancellations within 24 hours forfeit the deposit." value="Cancellations with less than 48 hours' notice forfeit the deposit."><span class="hint block">Shown when they book and on their confirmation. Isla quotes it if asked. These are your terms: write what you actually enforce.</span></label></div></section></div></body>
</html>
