<!doctype html>
<html>
<head>
<style>
	.card { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); }
	.btn-buy { box-shadow: 0 2px 0 #000; }
	.glow { background: radial-gradient(circle, #fff, transparent); }
	.frame-vignette { position: absolute; inset: 0; }
	.edges { box-shadow: inset 0 0 120px #000; }
	.past { filter: grayscale(1); }
	.slide { transition: transform 0.6s linear; }
	.spin { animation: turn 2s linear infinite; }
	@keyframes turn { to { rotate: 360deg; } }
	.nudge { transition: transform 0.3s cubic-bezier(0.3, 1.6, 0.6, 1); }
	.neon { color: #00FFFF; }
	h1 { font-family: "Acme Display", serif; }
	p { font-family: "Acme Text", sans-serif; }
	.quote { font-family: Georgia, serif; }
	.code { font-family: "Courier New", monospace; }
	.label { font-family: Futura, sans-serif; }
	/* slop-ok: the one deliberate hard shadow, a print look */
	.hero {
		box-shadow: 0 1px 0 #000;
	}
	.tag { box-shadow: 0 1px 0 #000; } /* slop-ok: */
	/* .ghost { box-shadow: 0 0 40px red; } a comment is never matched */
</style>
</head>
<body>
	<div class="scene" id="s1">
		<h1>Your invoices are late again. 🚀</h1>
		<a class="btn cta">Start free</a>
		<a class="btn primary">Book a demo</a>
	</div>
	<div class="scene" id="s2">
		<a class="cta">Try Acme</a>
		<div style="box-shadow: 0 4px 12px #0003">Invoice #1042</div>
	</div>
	<script>
		const jitter = Math.random();
		setTimeout(() => {}, 100);
		const url = 'https://acme.test/a//b'; // Math.random() in a comment is ignored
	</script>
</body>
</html>
